name: Mandatory assurance trusted gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-from-default-branch-trust-root:
    name: Mandatory assurance trusted gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Check out candidate as data only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact current base, exact head, and merge-result tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVALUATION_UTC: ${{ github.event.pull_request.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "${BASE_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${HEAD_SHA}"
          test -z "$(git -C trusted status --short)"
          test -z "$(git -C candidate status --short)"
          test "$(git -C candidate merge-base "${BASE_SHA}" "${HEAD_SHA}")" = "${BASE_SHA}"
          head_tree="$(git -C candidate rev-parse "${HEAD_SHA}^{tree}")"
          merge_tree="$(git -C candidate merge-tree --write-tree "${BASE_SHA}" "${HEAD_SHA}")"
          test "${merge_tree}" = "${head_tree}"
          printf '%s\n' "${BASE_SHA}" > "${RUNNER_TEMP}/trusted-base-sha.txt"
          printf '%s\n' "${HEAD_SHA}" > "${RUNNER_TEMP}/trusted-head-sha.txt"
          printf '%s\n' "${head_tree}" > "${RUNNER_TEMP}/trusted-head-tree.txt"

      - name: Run default-branch trusted assurance regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s trusted/tests -p 'test_*.py'

      - name: Fetch PR comments for trusted owner gates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            > "${RUNNER_TEMP}/trusted-pr-comments.json"

      - name: Validate assurance trust-root change boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B trusted/scripts/validate_assurance_trust_root.py \
            --repo-root candidate \
            --base-ref "${BASE_SHA}" \
            --trusted-manifest trusted/config/assurance-trust-root-manifest.json \
            --mode migration \
            --pr-number "${PR_NUMBER}" \
            --comments "${RUNNER_TEMP}/trusted-pr-comments.json" \
            --report "${RUNNER_TEMP}/trusted-assurance-trust-root-report.json"

      - name: Validate mandatory one-pass invariants with trusted code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B trusted/scripts/validate_mandatory_assurance_invariants.py \
            --repo-root candidate \
            --policy candidate/config/mandatory-assurance-invariant-policy.json \
            --base-ref "${BASE_SHA}" \
            --report "${RUNNER_TEMP}/trusted-mandatory-assurance-report.json"

      - name: Validate transition governance with trusted code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B trusted/scripts/validate_transition_metrics.py \
            --repo-root candidate \
            --policy candidate/config/transition-metrics-policy.json \
            --base-ref "${BASE_SHA}" \
            --report "${RUNNER_TEMP}/trusted-transition-metrics-report.json"

      - name: Enforce exact owner approval for invariant exceptions
        env:
          OWNER_LOGIN: TimSimmons3
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVALUATION_UTC: ${{ github.event.pull_request.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          exception_count="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/trusted-mandatory-assurance-report.json",encoding="utf-8"))["exception_record_count"])')"
          if [[ "${exception_count}" == "0" ]]; then
            exit 0
          fi
          python3 -B trusted/scripts/validate_owner_exception_approval.py \
            --report "${RUNNER_TEMP}/trusted-mandatory-assurance-report.json" \
            --comments "${RUNNER_TEMP}/trusted-pr-comments.json" \
            --owner-login "${OWNER_LOGIN}" \
            --pr-number "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}" \
            --repo-root candidate \
            --evaluation-utc "${EVALUATION_UTC}" \
            --output "${RUNNER_TEMP}/trusted-owner-approval-report.json"
